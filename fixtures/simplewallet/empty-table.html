<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MY TRANSACTION — simplewallet.in (SYNTHETIC)</title>
</head>
<body>
  <h2>MY TRANSACTION</h2>
  <table id="gvList" border="1" cellpadding="4" cellspacing="0">
    <thead>
      <tr>
        <th>Trn No</th>
        <th>Service</th>
        <th>Service Name</th>
        <th>Customer No</th>
        <th>Transaction Date</th>
        <th>Status</th>
        <th>Operator ID</th>
        <th>Disc (%)</th>
        <th>Amount</th>
        <th>Disc (Rs)</th>
        <th>Receipt</th>
      </tr>
    </thead>
    <tbody>
      <!-- No data rows — zero-transaction day -->
    </tbody>
    <tfoot>
      <tr class="gridgrandtotal">
        <td colspan="8">Grand Total : </td>
        <td><span id="lblAmtGrandAmt">0.00</span></td>
        <td><span id="lblDiscRsGrandAmt">0.00</span></td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
